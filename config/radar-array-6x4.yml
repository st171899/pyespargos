# Standard 6-column x 4-row aperture; 24 antennas.
# PROVISIONAL left-to-right order: ba1=.204, ba2=.203, ba3=.55.
# Match board orientation to aperture-kit-6x4.yml.
# Cable lengths 0.0 and velocity factors 0.76 are PLACEHOLDERS, not measurements.
# Replace them before quantitative phase/delay calibration.
# Shared reference master is the separate board 10.42.0.35.
# This geometry file does not connect/control that master or enable joint radar UI processing.
combined-array:
  boards:
    ba1:
      host: 10.42.0.204
      cable:
        length: 0.0
        velocity_factor: 0.76
    ba2:
      host: 10.42.0.203
      cable:
        length: 0.0
        velocity_factor: 0.76
    ba3:
      host: 10.42.0.55
      cable:
        length: 0.0
        velocity_factor: 0.76
  array:
  - - ba1.1.0
    - ba1.0.0
    - ba2.1.0
    - ba2.0.0
    - ba3.1.0
    - ba3.0.0
  - - ba1.1.1
    - ba1.0.1
    - ba2.1.1
    - ba2.0.1
    - ba3.1.1
    - ba3.0.1
  - - ba1.1.2
    - ba1.0.2
    - ba2.1.2
    - ba2.0.2
    - ba3.1.2
    - ba3.0.2
  - - ba1.1.3
    - ba1.0.3
    - ba2.1.3
    - ba2.0.3
    - ba3.1.3
    - ba3.0.3
